apiVersion: v1
kind: Service
metadata:
  name: order-tracker-app
  namespace: order-tracker
spec:
  selector:
    app: order-tracker-app
  ports:
    - port: 5000
      targetPort: 5000
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-tracker-app
  namespace: order-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-tracker-app
  template:
    metadata:
      labels:
        app: order-tracker-app
    spec:
      containers:
      - name: app
        image: devops-order-tracker:latest
        imagePullPolicy: Never
        command: ["python", "run.py"]
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: order-tracker-config
              key: FLASK_ENV
        - name: FLASK_APP
          valueFrom:
            configMapKeyRef:
              name: order-tracker-config
              key: FLASK_APP
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: order-tracker-config
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-tracker-secret
              key: DATABASE_PASSWORD
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: order-tracker-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: order-tracker-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: order-tracker-config
              key: DATABASE_NAME
        - name: DATABASE_URL
          value: "postgresql://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"